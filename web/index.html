    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      /* Áp dụng giao diện sáng/tối trước khi trang hiện ra (tránh nháy màn hình) */
      try { var t = localStorage.getItem('sy_theme'); if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
